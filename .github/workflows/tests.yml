name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: pip install -e .
      - run: pytest -q
      - name: Build dbt models against sample data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_test
          PGDATABASE: portfolio_test
        run: |
          pip install -r requirements-dbt.txt
          python scripts/load_sample.py
          dbt build --project-dir dbt --profiles-dir dbt
